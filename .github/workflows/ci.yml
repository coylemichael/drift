# Drift is developed on one host and used on all three: every push and pull request runs the
# suite, typecheck and lint on Ubuntu, macOS and Windows so a change cannot land green on the
# authoring machine and break the next one to pull.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - run: python -m pip install ruff==0.17.0
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python -I scripts/build-changelog.py . --check
